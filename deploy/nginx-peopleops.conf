# /etc/nginx/sites-available/peopleops — HTTP block as written; certbot --nginx then
# added the 443 server (Let's Encrypt certificate) and the HTTP→HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name peopleops.77-42-88-180.sslip.io;

    client_max_body_size 1m;
    server_tokens off;   # added 2026-11-10 (hide the nginx version); HSTS and CSP come from the app (src/proxy.ts)

    location / {
        proxy_pass http://127.0.0.1:3310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append) so clients cannot spoof the address used by the login throttle.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
